[package]
name = "dravyn-desktop"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dravyn-common = { version = "0.1.0", path = "../../../crates/dravyn-common" }
dravyn-core = { version = "0.1.0", path = "../../../crates/dravyn-core" }
dravyn-fingerprint = { version = "0.1.0", path = "../../../crates/dravyn-fingerprint" }
dravyn-network = { version = "0.1.0", path = "../../../crates/dravyn-network" }
dravyn-privacy = { version = "0.1.0", path = "../../../crates/dravyn-privacy" }
dravyn-profile = { version = "0.1.0", path = "../../../crates/dravyn-profile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[workspace]
